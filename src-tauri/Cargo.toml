[package]
name = "MissionDesk"
version = "3.0.9"
description = "UAS mission planning and EASA SORA 2.5 assessment aid"
authors = ["Lars Wallström"]
license = "AGPL-3.0-only"
repository = "https://github.com/tevekanna/missiondesk"
edition = "2021"

[lib]
name = "MissionDesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "1", features = ["codegen"] }

[dependencies]
tauri = { version = "1", features = [ "protocol-asset", "shell-open"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
